# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2
build:
  os: "ubuntu-22.04"
  tools:
    python: "3.10"
submodules:
  include: all
  recursive: true
sphinx:
  configuration: docs/source/conf.py
# Install the package and its docs extra straight from pyproject.toml.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

