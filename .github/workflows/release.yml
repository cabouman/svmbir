name: Build and Release Wheels

# On a version tag: build all wheels (Linux + macOS arm64) and the sdist, and attach
# them to a draft GitHub Release. Publishing the draft triggers publish.yml (PyPI).
#
# On a pull request that changes the packaging, and on manual dispatch: build and
# test the wheels only, so a broken wheel build shows up before a release. Nothing
# is released or uploaded in that case.

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
  workflow_dispatch:

# Jobs that need to write to the release say so themselves.
permissions:
  contents: read

jobs:
  create-draft-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true

  build-wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          # Apple Silicon runner. libomp from Homebrew on this runner targets macOS 14,
          # so the wheels must target 14.0 for delocate to bundle it.
          - os: macos-14
            macos_target: "14.0"
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2.1

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - name: Install the sdist and run the tests
        # The sdist must carry the C sources; a clean install from it proves
        # that it does.
        # The tests run from a copy outside the source tree, so that the
        # installed package is imported and not the source directory.
        run: |
          python -m venv sdist-env
          sdist-env/bin/pip install dist/*.tar.gz pytest
          mkdir sdist-test && cp -r svmbir/tests sdist-test/tests
          cd sdist-test && ../sdist-env/bin/pytest -q tests

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  upload-to-release:
    name: Upload to draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-draft-release, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload to draft release
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
