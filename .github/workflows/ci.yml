name: CI

on:
  push:
    branches: [main, prerelease]
  pull_request:
    branches: [main, prerelease]
  # Weekly run so a new Python or dependency release that breaks the build shows up
  # without a push. GitHub runs scheduled workflows on the default branch (main) only.
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC

# The token can only read the repository.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # One macOS job, so a macOS build failure shows up before a release.
          - os: macos-14
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up conda (Miniforge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          miniforge-variant: Miniforge3
          use-mamba: true
          auto-activate-base: false
          activate-environment: test-env

      - name: Install llvm-openmp (macOS)
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: conda install -y -c conda-forge llvm-openmp

      - name: Install svmbir with dev dependencies
        shell: bash -el {0}
        run: pip install -e ".[dev]"

      - name: Run tests
        shell: bash -el {0}
        run: pytest svmbir/tests/ -v
