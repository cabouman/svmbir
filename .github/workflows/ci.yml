name: CI

on:
  push:
    branches: [master, prerelease]
  pull_request:
    branches: [master, prerelease]
  # Weekly run so a new Python or dependency release that breaks the build shows up
  # without a push. GitHub runs scheduled workflows on the default branch (master) only.
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC

jobs:
  build-and-test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up conda (Miniforge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          miniforge-variant: Miniforge3
          use-mamba: true
          auto-activate-base: false
          activate-environment: test-env

      - name: Install llvm-openmp (macOS)
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: conda install -y -c conda-forge llvm-openmp

      - name: Install svmbir with dev dependencies
        shell: bash -el {0}
        run: pip install -e ".[dev]"

      - name: Run tests
        shell: bash -el {0}
        run: pytest svmbir/tests/ -v
