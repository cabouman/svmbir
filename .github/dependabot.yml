# Dependabot version updates: one grouped PR per ecosystem per week.
# GitHub reads this file from the default branch (main) only.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "prerelease"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directories:
      - "/"
    target-branch: "prerelease"
    schedule:
      interval: "weekly"
    groups:
      pip:
        patterns: ["*"]
