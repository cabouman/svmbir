[build-system]
requires = ["setuptools", "wheel", "numpy>=1.26.0", "Cython"]
build-backend = "setuptools.build_meta"

[project]
# Keep version in sync with svmbir/__init__.py
name = "svmbir"
version = "0.4.0"
description = "Python code for fast parallel-beam MBIR (Model Based Iterative Reconstruction)"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
maintainers = [{name = "Charles A. Bouman", email = "charles.bouman@gmail.edu"}]
dependencies = [
    "numpy>=1.26.0",
    "psutil>=5.8",
    "Pillow>=12.3.0",  # first release without known advisories (Dependabot alerts #17-#40)
]

[project.optional-dependencies]
dev  = ["pytest", "ruamel.yaml", "Cython"]
docs = ["sphinx", "sphinx-rtd-theme", "sphinxcontrib-bibtex", "ipython>=6.3.1"]
demo = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/cabouman/svmbir"

[tool.setuptools.packages.find]
where     = ["."]
include   = ["svmbir*"]

[tool.cibuildwheel]
# Build CPython 3.10–3.12 only; skip musl Linux (Alpine) and PyPy.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip  = "*-musllinux_*"
# Install each built wheel and run the tests against it. Only the test file is copied
# into the (temporary) test directory, so the installed wheel is what gets imported,
# not the source tree.
test-requires = ["pytest"]
test-sources  = ["svmbir/tests/test_recon.py"]
test-command  = "pytest svmbir/tests"

[tool.cibuildwheel.linux]
# x86_64 only — 32-bit (i686) wheels have been dropped: numpy has published no
# 32-bit Linux wheels since 1.21, so they could be neither built nor tested cheaply.
archs = ["x86_64"]

[tool.cibuildwheel.macos]
# arm64 only — Intel Mac support has been dropped.
# Install libomp before each build so setup.py's brew fallback finds it.
# delocate (run automatically by cibuildwheel) then bundles it into the wheel.
archs = ["arm64"]
before-build = "brew install libomp"
